<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Register</title>
</head>

<body>
    <div id="register">
        <input required id="email" placeholder="Enter your own email" type="email"  />
        <input required id="password" placeholder="Enter your password" type="password"/>
        <input required id="firstName" placeholder="Enter your first name" />
        <input required id="lastName" placeholder="Enter your last name" />
        <button required id="registerButton">שליחת הפרטים והרשמה</button>
    </div>
    <div id="login">
        <input required id="emailLogin" placeholder="Enter your email" type="email" />
        <input required id="passwordLogin" placeholder="Enter your password" type="password" />
        <button id="loginButton">כניסה למערכת</button>
    </div>

    <div id="explanation">Explanation:  Password at least 4 chars, first name, last name at list 2 chars</div>




</body>
</html>
